[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acute-malnutrition-chap-model"
version = "0.1.0"
description = "CHAP-compatible acute malnutrition forecasting model"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "chap_model.py",
  "train.py",
  "predict.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "chap_model.py",
  "train.py",
  "predict.py",
  "MLproject",
  "MLProject.yaml",
  "pyproject.toml",
  "README.md",
]
